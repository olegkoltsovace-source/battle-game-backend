cors.origins=${CORS_ORIGINS:http://localhost:5173}

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:battlegamedb}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:Illusion9a7!}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
# ddl-auto is set to none ? Flyway now owns all schema changes
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# baseline-on-migrate=true is required because the database already exists.
# Flyway will mark the current state as baseline and only run new migrations going forward.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0